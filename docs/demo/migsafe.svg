<svg xmlns="http://www.w3.org/2000/svg" width="980" height="470" viewBox="0 0 980 470" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#11161d"/><stop offset="1" stop-color="#0b0f14"/></linearGradient></defs>
<rect width="980" height="470" rx="12" fill="url(#bg)"/>
<rect width="980" height="42" rx="12" fill="#161d26"/>
<rect y="30" width="980" height="12" fill="#161d26"/>
<circle cx="22" cy="21" r="6" fill="#ff5f57"/><circle cx="44" cy="21" r="6" fill="#febc2e"/><circle cx="66" cy="21" r="6" fill="#28c840"/>
<text x="490.0" y="26" fill="#7d8794" font-size="12" text-anchor="middle">migsafe · migration check</text>
<text x="24" y="64" fill="#4fd18b" font-size="13">$ migsafe check migrations/2026_10_29_add_user_flags.sql</text>
<text x="24" y="88" fill="#ffa94d" font-size="13" xml:space="preserve">migsafe: 4 finding(s), worst high</text>
<text x="24" y="108" fill="#d7dde5" font-size="13" xml:space="preserve"></text>
<text x="24" y="128" fill="#ffa94d" font-size="13" xml:space="preserve">[HIGH] line 2 (volatile-default)</text>
<text x="24" y="148" fill="#d7dde5" font-size="13" xml:space="preserve">  what: Volatile DEFAULT (now()) rewrites the table and takes a long lock</text>
<text x="24" y="168" fill="#d7dde5" font-size="13" xml:space="preserve">  fix:  Add the column without a default, backfill in batches, then set the default</text>
<text x="24" y="188" fill="#d7dde5" font-size="13" xml:space="preserve"></text>
<text x="24" y="208" fill="#ffa94d" font-size="13" xml:space="preserve">[HIGH] line 3 (index-not-concurrent)</text>
<text x="24" y="228" fill="#d7dde5" font-size="13" xml:space="preserve">  what: CREATE INDEX on existing table &#x27;users&#x27; blocks writes for the whole build</text>
<text x="24" y="248" fill="#d7dde5" font-size="13" xml:space="preserve">  fix:  Use CREATE INDEX CONCURRENTLY (outside a transaction) on existing tables</text>
<text x="24" y="268" fill="#d7dde5" font-size="13" xml:space="preserve"></text>
<text x="24" y="288" fill="#ffa94d" font-size="13" xml:space="preserve">[HIGH] line 4 (constraint-without-not-valid)</text>
<text x="24" y="308" fill="#4fd18b" font-size="13" xml:space="preserve">  what: Adding a FK or CHECK constraint validates every row under an exclusive lock</text>
<text x="24" y="328" fill="#4fd18b" font-size="13" xml:space="preserve">  fix:  Add it with NOT VALID, then VALIDATE CONSTRAINT in a separate migration</text>
<text x="24" y="348" fill="#d7dde5" font-size="13" xml:space="preserve"></text>
<text x="24" y="368" fill="#ffd43b" font-size="13" xml:space="preserve">[MEDIUM] line 1 (no-timeout)</text>
<text x="24" y="388" fill="#d7dde5" font-size="13" xml:space="preserve">  what: Migration sets no statement_timeout or lock_timeout</text>
<text x="24" y="408" fill="#d7dde5" font-size="13" xml:space="preserve">  fix:  Prefix the migration with SET lock_timeout = &#x27;3s&#x27;; SET statement_timeout = &#x27;30s&#x27;</text>
<text x="24" y="428" fill="#d7dde5" font-size="13" xml:space="preserve"></text>
<text x="24" y="448" fill="#ffa94d" font-size="13" xml:space="preserve">high:3  medium:1</text>
</svg>